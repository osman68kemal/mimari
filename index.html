
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archituna | Mimari Tasarım</title>
    <style>
        /* === VİDEODAKİ SİYAH LOADING EKRANI STİLLERİ === */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111; /* Koyu siyah arka plan */
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 1s ease-out; /* Yumuşakça kaybolma efekti */
        }
        
        #loading-screen h1 {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            font-size: 2em;
            letter-spacing: 12px; /* Harflerin arasını açar */
            animation: nefes-al 2s infinite; /* Yanıp sönme animasyonu */
        }

        @keyframes nefes-al {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }

        /* === ANA SİTE STİLLERİ === */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            overflow-x: hidden;
        }

        header {
            background-color: #222;
            color: #fff;
            padding: 50px 0 30px;
            text-align: center;
        }

        /* Logo Ayarları */
        .logo {
            max-width: 250px; /* Logonun büyüklüğünü buradan ayarlayabilirsin */
            margin-bottom: 20px;
        }

        header h2 {
            margin: 0;
            font-size: 2em;
            letter-spacing: 3px;
        }

        header p {
            color: #aaa;
            font-weight: 300;
        }

        .container {
            width: 80%;
            margin: 40px auto;
        }
    </style>
</head>
<body>

    <!-- Yükleme Ekranı -->
    <div id="loading-screen">
        <h1>LOADING</h1>
    </div>

    <!-- Sitenin Ana İçeriği -->
    <header>
        <!-- DİKKAT: Yüklediğin logonun adıyla buradaki 'logo.png' birebir aynı olmalı -->
        <img src="logo.png" alt="Archituna Logo" class="logo">
        <h2>ARCHITUNA</h2>
        <p>Yaratıcı Mimari Çözümler</p>
    </header>

    <div class="container">
        <!-- Daha önceki projelerin veya eklenecek renderlar buraya gelecek -->
        <p style="text-align: center; margin-top: 50px;">Portfolyo içerikleri buraya eklenecektir.</p>
    </div>

    <!-- === YÜKLEME EKRANINI GİZLEYEN JAVASCRIPT KODU === -->
    <script>
        window.addEventListener('load', function() {
            setTimeout(function() {
                const loading = document.getElementById('loading-screen');
                loading.style.opacity = '0'; // Önce saydamlaştır
                
                setTimeout(function() {
                    loading.style.display = 'none'; // Sonra tamamen kaldır
                }, 1000); // 1 saniyelik erime süresi
                
            }, 2500); // Yükleme ekranı 2.5 saniye ekranda kalır
        });
    </script>

</body>
</html>
