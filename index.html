<script>

/* =========================================================
   ARCHITUNA — PROJECT LIGHTBOX
   MOBILE SCROLL FIX
========================================================= */

(function initProjectLightbox() {

    const lightbox =
        document.getElementById('project-lightbox');

    const mediaBox =
        document.getElementById('project-lightbox-media');

    const numberBox =
        document.getElementById('project-lightbox-number');

    const nameBox =
        document.getElementById('project-lightbox-name');

    const closeBtn =
        document.querySelector('.project-lightbox-close');

    const prevBtn =
        document.querySelector('.project-lightbox-prev');

    const nextBtn =
        document.querySelector('.project-lightbox-next');


    if (
        !lightbox ||
        !mediaBox ||
        !numberBox ||
        !nameBox ||
        !closeBtn ||
        !prevBtn ||
        !nextBtn
    ) {
        console.error(
            'ARCHITUNA: Lightbox DOM elemanları bulunamadı.'
        );
        return;
    }


    /* =====================================================
       PROJECT LIST
    ===================================================== */

    const cards =
        Array.from(
            document.querySelectorAll('.project-card')
        );


    let current = 0;

    let touchStartX = 0;
    let touchStartY = 0;

    let lightboxIsOpen = false;

    /*
       Scroll konumu.
    */
    let savedScrollY = 0;

    /*
       Açılmadan önceki stiller.
    */
    let previousBodyOverflow = '';
    let previousBodyPosition = '';
    let previousBodyTop = '';
    let previousBodyWidth = '';
    let previousBodyPaddingRight = '';

    let previousHtmlOverflow = '';
    let previousHtmlOverscrollBehavior = '';

    /*
       Mobil cihaz kontrolü.
    */
    function isMobileDevice() {

        return window.matchMedia(
            '(max-width: 700px)'
        ).matches;

    }


    /* =====================================================
       SCROLL LOCK
    ===================================================== */

    function lockPageScroll() {

        if (lightboxIsOpen) {
            return;
        }

        lightboxIsOpen = true;


        const body =
            document.body;

        const html =
            document.documentElement;


        /*
           Scroll konumunu TAM OLARAK kaydet.
        */

        savedScrollY =
            window.scrollY ||
            window.pageYOffset ||
            0;


        /*
           Mevcut inline stilleri kaydet.
        */

        previousBodyOverflow =
            body.style.overflow;

        previousBodyPosition =
            body.style.position;

        previousBodyTop =
            body.style.top;

        previousBodyWidth =
            body.style.width;

        previousBodyPaddingRight =
            body.style.paddingRight;

        previousHtmlOverflow =
            html.style.overflow;

        previousHtmlOverscrollBehavior =
            html.style.overscrollBehavior;


        /*
           MOBİL
           -------------------------------------------------
           Mobilde body'yi fixed YAPMIYORUZ.

           Eski sistemde mobil Safari/Chrome'da:

               position:fixed
               top:-scrollY
               overflow:hidden

           kombinasyonu kapatıldıktan sonra sayfanın
           scroll mekanizması bazen kilitli kalabiliyordu.
        */

        if (isMobileDevice()) {

            html.style.overflow =
                'hidden';

            body.style.overflow =
                'hidden';

            html.style.overscrollBehavior =
                'none';

            /*
               Mobilde position fixed yok.
            */

            body.style.position =
                '';

            body.style.top =
                '';

            body.style.width =
                '';

        }

        /*
           DESKTOP
           -------------------------------------------------
           Masaüstündeki mevcut stabil fixed sistem korunuyor.
        */

        else {

            const scrollbarWidth =
                window.innerWidth -
                document.documentElement.clientWidth;


            if (scrollbarWidth > 0) {

                body.style.paddingRight =
                    scrollbarWidth + 'px';

            }


            body.style.position =
                'fixed';

            body.style.top =
                `-${savedScrollY}px`;

            body.style.width =
                '100%';

            body.style.overflow =
                'hidden';


            html.style.overflow =
                'hidden';

            html.style.overscrollBehavior =
                'none';

        }

    }


    /* =====================================================
       SCROLL UNLOCK
    ===================================================== */

    function unlockPageScroll() {

        if (!lightboxIsOpen) {
            return;
        }


        const body =
            document.body;

        const html =
            document.documentElement;


        /*
           Önce lightbox arayüzünü kapat.
        */

        lightbox.classList.remove(
            'is-open'
        );

        lightbox.setAttribute(
            'aria-hidden',
            'true'
        );


        /*
           MEDYAYI TEMİZLE.
        */

        mediaBox.innerHTML = '';


        /*
           =================================================
           MOBİL RESTORE
           =================================================
        */

        if (isMobileDevice()) {

            /*
               Önce scroll kilitlerini kaldır.
            */

            body.style.overflow =
                previousBodyOverflow;

            body.style.position =
                previousBodyPosition;

            body.style.top =
                previousBodyTop;

            body.style.width =
                previousBodyWidth;

            body.style.paddingRight =
                previousBodyPaddingRight;


            html.style.overflow =
                previousHtmlOverflow;

            html.style.overscrollBehavior =
                previousHtmlOverscrollBehavior;


            /*
               Bazı mobil tarayıcılar style değişikliğini
               aynı frame içerisinde uygulamıyor.

               Bu nedenle scroll'u bir sonraki frame'de,
               ardından bir frame daha sonra kesinleştiriyoruz.
            */

            requestAnimationFrame(
                function() {

                    window.scrollTo(
                        0,
                        savedScrollY
                    );


                    requestAnimationFrame(
                        function() {

                            window.scrollTo(
                                0,
                                savedScrollY
                            );

                        }
                    );

                }
            );

        }


        /*
           =================================================
           DESKTOP RESTORE
           =================================================
        */

        else {

            /*
               Önce fixed body'yi normal hale getir.
            */

            body.style.position =
                previousBodyPosition;

            body.style.top =
                previousBodyTop;

            body.style.width =
                previousBodyWidth;

            body.style.overflow =
                previousBodyOverflow;

            body.style.paddingRight =
                previousBodyPaddingRight;


            html.style.overflow =
                previousHtmlOverflow;

            html.style.overscrollBehavior =
                previousHtmlOverscrollBehavior;


            /*
               Eski konuma dön.
            */

            window.scrollTo({
                top: savedScrollY,
                left: 0,
                behavior: 'instant'
            });

        }


        /*
           Bir sonraki açılış için temizle.
        */

        lightboxIsOpen = false;

    }


    /* =====================================================
       MEDIA CREATE
    ===================================================== */

    function createMedia(card) {

        const source =
            card.querySelector(
                'img, video'
            );


        if (!source) {
            return null;
        }


        const tag =
            source.tagName.toLowerCase();


        /*
           VIDEO
        */

        if (tag === 'video') {

            const media =
                document.createElement(
                    'video'
                );


            media.src =
                source.currentSrc ||
                source.src ||
                source.getAttribute('src');


            media.controls = true;

            media.autoplay = true;

            media.loop = true;

            media.playsInline = true;

            media.preload = 'auto';

            media.muted = false;


            return media;

        }


        /*
           IMAGE
        */

        const media =
            document.createElement(
                'img'
            );


        media.src =
            source.currentSrc ||
            source.src ||
            source.getAttribute('src');


        media.alt =
            source.alt || '';


        return media;

    }


    /* =====================================================
       OPEN
    ===================================================== */

    function openAt(index) {

        if (!cards.length) {
            return;
        }


        current =
            (
                index +
                cards.length
            ) % cards.length;


        const card =
            cards[current];


        const media =
            createMedia(card);


        if (!media) {
            return;
        }


        /*
           İlk açılışta scroll'u kilitle.
        */

        if (!lightboxIsOpen) {

            lockPageScroll();

        }


        /*
           Yeni medyayı yerleştir.
        */

        mediaBox.innerHTML = '';

        mediaBox.appendChild(
            media
        );


        /*
           Bilgiler.
        */

        const number =
            card.querySelector(
                '.project-number'
            );

        const name =
            card.querySelector(
                '.project-name'
            );


        numberBox.textContent =
            number
                ? number.textContent.trim()
                : '';


        nameBox.textContent =
            name
                ? name.textContent.trim()
                : '';


        /*
           Lightbox'ı göster.
        */

        lightbox.classList.add(
            'is-open'
        );

        lightbox.setAttribute(
            'aria-hidden',
            'false'
        );


        /*
           Video.
        */

        if (
            media.tagName.toLowerCase() ===
            'video'
        ) {

            media.play().catch(
                function() {}
            );

        }

    }


    /* =====================================================
       CLOSE
    ===================================================== */

    function closeLightbox() {

        if (
            !lightbox.classList.contains(
                'is-open'
            )
        ) {
            return;
        }


        unlockPageScroll();

    }


    /* =====================================================
       MOVE
    ===================================================== */

    function move(step) {

        if (!cards.length) {
            return;
        }


        openAt(
            current + step
        );

    }


    /* =====================================================
       CARD CLICK
    ===================================================== */

    cards.forEach(
        function(card, index) {

            const image =
                card.querySelector(
                    '.project-image'
                );


            if (!image) {
                return;
            }


            image.setAttribute(
                'role',
                'button'
            );


            image.setAttribute(
                'tabindex',
                '0'
            );


            image.setAttribute(
                'aria-label',
                'Projeyi tam ekran görüntüle'
            );


            image.addEventListener(
                'click',
                function(e) {

                    e.preventDefault();

                    e.stopPropagation();

                    openAt(index);

                }
            );


            image.addEventListener(
                'keydown',
                function(e) {

                    if (
                        e.key === 'Enter' ||
                        e.key === ' '
                    ) {

                        e.preventDefault();

                        openAt(index);

                    }

                }
            );

        }
    );


    /* =====================================================
       CLOSE BUTTON
    ===================================================== */

    closeBtn.addEventListener(
        'click',
        function(e) {

            e.preventDefault();

            e.stopPropagation();

            closeLightbox();

        }
    );


    /* =====================================================
       PREVIOUS
    ===================================================== */

    prevBtn.addEventListener(
        'click',
        function(e) {

            e.preventDefault();

            e.stopPropagation();

            move(-1);

        }
    );


    /* =====================================================
       NEXT
    ===================================================== */

    nextBtn.addEventListener(
        'click',
        function(e) {

            e.preventDefault();

            e.stopPropagation();

            move(1);

        }
    );


    /* =====================================================
       BACKGROUND CLICK
    ===================================================== */

    lightbox.addEventListener(
        'click',
        function(e) {

            if (
                e.target === lightbox
            ) {

                closeLightbox();

            }

        }
    );


    /* =====================================================
       KEYBOARD
    ===================================================== */

    document.addEventListener(
        'keydown',
        function(e) {

            if (
                !lightbox.classList.contains(
                    'is-open'
                )
            ) {
                return;
            }


            if (
                e.key === 'Escape'
            ) {

                e.preventDefault();

                closeLightbox();

                return;

            }


            if (
                e.key === 'ArrowLeft'
            ) {

                e.preventDefault();

                move(-1);

                return;

            }


            if (
                e.key === 'ArrowRight'
            ) {

                e.preventDefault();

                move(1);

                return;

            }

        }
    );


    /* =====================================================
       MOBILE SWIPE
    ===================================================== */

    lightbox.addEventListener(
        'touchstart',
        function(e) {

            if (
                !e.changedTouches.length
            ) {
                return;
            }


            touchStartX =
                e.changedTouches[0].clientX;

            touchStartY =
                e.changedTouches[0].clientY;

        },
        {
            passive: true
        }
    );


    lightbox.addEventListener(
        'touchend',
        function(e) {

            if (
                !e.changedTouches.length
            ) {
                return;
            }


            const touch =
                e.changedTouches[0];


            const dx =
                touch.clientX -
                touchStartX;


            const dy =
                touch.clientY -
                touchStartY;


            /*
               Sadece belirgin yatay hareket.
            */

            if (
                Math.abs(dx) > 55 &&
                Math.abs(dx) > Math.abs(dy)
            ) {

                if (dx < 0) {

                    move(1);

                }

                else {

                    move(-1);

                }

            }

        },
        {
            passive: true
        }
    );


    /* =====================================================
       PAGEHIDE
    ===================================================== */

    window.addEventListener(
        'pagehide',
        function() {

            const body =
                document.body;

            const html =
                document.documentElement;


            /*
               Her durumda tüm scroll kilitlerini
               temizle.
            */

            body.style.position =
                previousBodyPosition;

            body.style.top =
                previousBodyTop;

            body.style.width =
                previousBodyWidth;

            body.style.overflow =
                previousBodyOverflow;

            body.style.paddingRight =
                previousBodyPaddingRight;


            html.style.overflow =
                previousHtmlOverflow;

            html.style.overscrollBehavior =
                previousHtmlOverscrollBehavior;


            lightboxIsOpen = false;

        }
    );


    /* =====================================================
       RESIZE
    ===================================================== */

    window.addEventListener(
        'resize',
        function() {

            /*
               Lightbox açıkken yön değişimi
               yaşanırsa scroll konumu korunur.
            */

            if (
                lightboxIsOpen &&
                isMobileDevice()
            ) {

                window.scrollTo(
                    0,
                    savedScrollY
                );

            }

        },
        {
            passive: true
        }
    );


    /* =====================================================
       READY
    ===================================================== */

    console.log(
        'ARCHITUNA Lightbox hazır:',
        cards.length,
        'proje'
    );

})();

</script>
