<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archituna | Çağının Ötesinde Fikirler</title>
    <style>
        /* === GENEL AYARLAR === */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #e9e9e9;
            color: #222;
            overflow-x: hidden;
            height: 100vh;
        }

        /* === OTOMATİK VİDEOLU AÇILIŞ EKRANI === */
        #intro-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #111;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 1.5s ease-in-out;
        }

        /* Ziyaretçiyi karşılayan geçici metin */
        #loading-text {
            position: absolute;
            z-index: 10001;
            color: #fff;
            font-size: 1.2em;
            letter-spacing: 5px;
            text-transform: uppercase;
            font-weight: 300;
            animation: fadeOut 3s forwards;
            pointer-events: none;
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Sessiz ve otomatik başlayan video */
        #intro-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* === ANA SAYFA (MARJİNAL TASARIM) === */
        #main-content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            opacity: 0; 
            transition: opacity 2s ease-in;
        }

        /* Dev Filigran Logo Arka Planı */
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(2.5);
            opacity: 0.04; 
            z-index: 1;
            pointer-events: none;
        }

        /* İkili Kimlik: ARCHITUNA -> TUNALI MİMARLIK Geçişi */
        .brand-name {
            font-size: 3em;
            letter-spacing: 8px;
            margin-bottom: 10px;
            cursor: default;
            transition: color 0.4s ease;
            position: relative;
            z-index: 20;
        }

        .brand-name::after {
            content: "ARCHITUNA"; 
        }

        .brand-name:hover::after {
            content: "TUNALI MİMARLIK"; 
        }

        /* Manifesto */
        .manifesto {
            font-size: 1.5em;
            font-weight: 300;
            letter-spacing: 2px;
            color: #555;
            margin-top: 20px;
            z-index: 20;
        }
    </style>
</head>
<body>

    <!-- AÇILIŞ EKRANI -->
    <div id="intro-screen">
        <div id="loading-text">Vizyonunuz Yükleniyor...</div>
        
        <!-- Video adı 'intro.mp4' olarak ayarlandı -->
        <video id="intro-video" src="intro.mp4" muted autoplay playsinline></video>
    </div>

    <!-- ARKA PLAN FİLİGRAN LOGOSU -->
    <img src="logo.png" class="watermark" alt="Filigran">

    <!-- ANA SAYFA İÇERİĞİ -->
    <div id="main-content">
        <h1 class="brand-name"></h1>
        <p class="manifesto">Çağının Ötesinde Fikirler. Sarsılmaz Temeller.</p>
        
        <p style="margin-top: 50px; font-size: 0.9em; color: #888; letter-spacing: 1px;">
            Tasarım • Proje • 3D Render
        </p>
    </div>

    <!-- JAVASCRIPT: VİDEO VE GEÇİŞ KONTROLÜ -->
    <script>
        const introVideo = document.getElementById('intro-video');
        const introScreen = document.getElementById('intro-screen');
        const mainContent = document.getElementById('main-content');

        // Ana sayfaya geçiş fonksiyonu
        function switchToMain() {
            introScreen.style.opacity = '0'; 
            setTimeout(function() {
                introScreen.style.display = 'none'; 
                mainContent.style.opacity = '1'; 
            }, 1500); 
        }

        // 1. Durum: Video sorunsuz oynar ve biterse geçiş yap
        introVideo.addEventListener('ended', switchToMain);

        // 2. Durum (Güvenlik Koruması): Eğer video bulunamazsa veya hata verirse, sonsuza kadar siyah ekranda kalmamak için 5 saniye sonra otomatik geçiş yap
        setTimeout(function() {
            if (introVideo.readyState === 0 || introVideo.paused) {
                switchToMain();
            }
        }, 5000);
    </script>

</body>
</html>
