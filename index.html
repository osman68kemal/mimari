<script>

/* =========================================================
   ARCHITUNA — PROJECT LIGHTBOX
   STABLE DESKTOP + MOBILE VERSION
========================================================= */

(function () {

    function initProjectLightbox() {

        const lightbox =
            document.getElementById('project-lightbox');

        const mediaBox =
            document.getElementById('project-lightbox-media');

        const numberBox =
            document.getElementById('project-lightbox-number');

        const nameBox =
            document.getElementById('project-lightbox-name');

        const closeBtn =
            document.querySelector('.project-lightbox-close');

        const prevBtn =
            document.querySelector('.project-lightbox-prev');

        const nextBtn =
            document.querySelector('.project-lightbox-next');


        /* =====================================================
           DOM KONTROLÜ
        ===================================================== */

        if (
            !lightbox ||
            !mediaBox ||
            !numberBox ||
            !nameBox ||
            !closeBtn ||
            !prevBtn ||
            !nextBtn
        ) {

            console.warn(
                'ARCHITUNA: Lightbox elemanları bulunamadı.'
            );

            return;
        }


        /* =====================================================
           PROJECT LIST
        ===================================================== */

        const cards =
            Array.from(
                document.querySelectorAll('.project-card')
            );


        if (!cards.length) {

            console.warn(
                'ARCHITUNA: .project-card bulunamadı.'
            );

            return;
        }


        /* =====================================================
           VARIABLES
        ===================================================== */

        let current = 0;

        let lightboxIsOpen = false;

        let savedScrollY = 0;

        let touchStartX = 0;
        let touchStartY = 0;


        /*
           Önceki stilleri sakla.
        */

        let previousBodyOverflow = '';
        let previousBodyTouchAction = '';
        let previousHtmlOverflow = '';
        let previousHtmlTouchAction = '';


        /* =====================================================
           DEVICE
        ===================================================== */

        function isMobileDevice() {

            return window.matchMedia(
                '(max-width: 700px)'
            ).matches;

        }


        /* =====================================================
           LOCK SCROLL
        ===================================================== */

        function lockPageScroll() {

            if (lightboxIsOpen) {
                return;
            }


            const body =
                document.body;

            const html =
                document.documentElement;


            /*
               Mevcut konumu kaydet.
            */

            savedScrollY =
                window.scrollY ||
                window.pageYOffset ||
                0;


            /*
               Mevcut inline stilleri kaydet.
            */

            previousBodyOverflow =
                body.style.overflow;

            previousBodyTouchAction =
                body.style.touchAction;

            previousHtmlOverflow =
                html.style.overflow;

            previousHtmlTouchAction =
                html.style.touchAction;


            /*
               ÖNEMLİ:
               Body artık position:fixed yapılmıyor.

               Böylece masaüstü sayfanın layout'u bozulmuyor.
            */

            html.style.overflow =
                'hidden';

            body.style.overflow =
                'hidden';


            /*
               Mobilde arka planın dokunmatik scroll'u
               engellenir.
            */

            if (isMobileDevice()) {

                html.style.touchAction =
                    'none';

                body.style.touchAction =
                    'none';

            }


            lightboxIsOpen = true;

        }


        /* =====================================================
           UNLOCK SCROLL
        ===================================================== */

        function unlockPageScroll() {

            if (!lightboxIsOpen) {
                return;
            }


            const body =
                document.body;

            const html =
                document.documentElement;


            /*
               Önce lightbox'ı kapat.
            */

            lightbox.classList.remove(
                'is-open'
            );

            lightbox.setAttribute(
                'aria-hidden',
                'true'
            );


            /*
               Videoyu tamamen kaldır.
            */

            mediaBox.innerHTML = '';


            /*
               Scroll stillerini geri getir.
            */

            body.style.overflow =
                previousBodyOverflow;

            body.style.touchAction =
                previousBodyTouchAction;

            html.style.overflow =
                previousHtmlOverflow;

            html.style.touchAction =
                previousHtmlTouchAction;


            /*
               Eski konuma dön.

               requestAnimationFrame kullanıyoruz çünkü
               bazı tarayıcılarda overflow değişikliği
               aynı frame'de uygulanabiliyor.
            */

            requestAnimationFrame(
                function () {

                    window.scrollTo(
                        0,
                        savedScrollY
                    );

                    requestAnimationFrame(
                        function () {

                            window.scrollTo(
                                0,
                                savedScrollY
                            );

                        }
                    );

                }
            );


            lightboxIsOpen = false;

        }


        /* =====================================================
           CREATE MEDIA
        ===================================================== */

        function createMedia(card) {

            const source =
                card.querySelector(
                    'img, video'
                );


            if (!source) {
                return null;
            }


            const tag =
                source.tagName.toLowerCase();


            /* =================================================
               VIDEO
            ================================================= */

            if (tag === 'video') {

                const media =
                    document.createElement(
                        'video'
                    );


                /*
                   Önce currentSrc.
                   Yoksa src.
                */

                media.src =
                    source.currentSrc ||
                    source.src ||
                    source.getAttribute('src') ||
                    '';


                /*
                   Video özellikleri.
                */

                media.controls = true;

                media.autoplay = true;

                media.loop = true;

                media.playsInline = true;

                media.preload = 'auto';

                /*
                   Tarayıcı otomatik oynatma için
                   gerekirse muted kalabilir.
                */

                media.muted =
                    source.muted || false;


                /*
                   Sınıf ekle.
                */

                media.className =
                    'project-lightbox-video';


                return media;

            }


            /* =================================================
               IMAGE
            ================================================= */

            const media =
                document.createElement(
                    'img'
                );


            media.src =
                source.currentSrc ||
                source.src ||
                source.getAttribute('src') ||
                '';


            media.alt =
                source.alt || '';


            media.className =
                'project-lightbox-image';


            /*
               Mobil tarayıcıların resmi gereksiz yere
               sürüklemesini engelle.
            */

            media.draggable = false;


            return media;

        }


        /* =====================================================
           OPEN
        ===================================================== */

        function openAt(index) {

            if (!cards.length) {
                return;
            }


            /*
               Güvenli index.
            */

            current =
                (
                    index +
                    cards.length
                ) % cards.length;


            const card =
                cards[current];


            const media =
                createMedia(card);


            if (!media) {
                return;
            }


            /*
               İlk açılışta scroll kilitle.
            */

            if (!lightboxIsOpen) {

                lockPageScroll();

            }


            /*
               Eski medyayı temizle.
            */

            mediaBox.innerHTML = '';


            /*
               Yeni medyayı ekle.
            */

            mediaBox.appendChild(
                media
            );


            /* =================================================
               NUMBER
            ================================================= */

            const number =
                card.querySelector(
                    '.project-number'
                );


            numberBox.textContent =
                number
                    ? number.textContent.trim()
                    : '';


            /* =================================================
               NAME
            ================================================= */

            const name =
                card.querySelector(
                    '.project-name'
                );


            nameBox.textContent =
                name
                    ? name.textContent.trim()
                    : '';


            /* =================================================
               SHOW
            ================================================= */

            lightbox.classList.add(
                'is-open'
            );

            lightbox.setAttribute(
                'aria-hidden',
                'false'
            );


            /*
               Video oynat.
            */

            if (
                media.tagName.toLowerCase() ===
                'video'
            ) {

                media.play().catch(
                    function () {

                        /*
                           Otomatik oynatma
                           engellenirse problem değil.
                        */

                    }
                );

            }

        }


        /* =====================================================
           CLOSE
        ===================================================== */

        function closeLightbox() {

            if (
                !lightbox.classList.contains(
                    'is-open'
                )
            ) {
                return;
            }


            unlockPageScroll();

        }


        /* =====================================================
           NEXT / PREVIOUS
        ===================================================== */

        function move(step) {

            if (!cards.length) {
                return;
            }


            openAt(
                current + step
            );

        }


        /* =====================================================
           CARD CLICK
        ===================================================== */

        cards.forEach(
            function (card, index) {

                const image =
                    card.querySelector(
                        '.project-image'
                    );


                if (!image) {
                    return;
                }


                /*
                   Accessibility.
                */

                image.setAttribute(
                    'role',
                    'button'
                );

                image.setAttribute(
                    'tabindex',
                    '0'
                );

                image.setAttribute(
                    'aria-label',
                    'Projeyi tam ekran görüntüle'
                );


                /* ---------------------------------------------
                   CLICK
                --------------------------------------------- */

                image.addEventListener(
                    'click',
                    function (e) {

                        e.preventDefault();

                        e.stopPropagation();

                        openAt(index);

                    }
                );


                /* ---------------------------------------------
                   ENTER / SPACE
                --------------------------------------------- */

                image.addEventListener(
                    'keydown',
                    function (e) {

                        if (
                            e.key === 'Enter' ||
                            e.key === ' '
                        ) {

                            e.preventDefault();

                            openAt(index);

                        }

                    }
                );

            }
        );


        /* =====================================================
           CLOSE BUTTON
        ===================================================== */

        closeBtn.addEventListener(
            'click',
            function (e) {

                e.preventDefault();

                e.stopPropagation();

                closeLightbox();

            }
        );


        /* =====================================================
           PREVIOUS
        ===================================================== */

        prevBtn.addEventListener(
            'click',
            function (e) {

                e.preventDefault();

                e.stopPropagation();

                move(-1);

            }
        );


        /* =====================================================
           NEXT
        ===================================================== */

        nextBtn.addEventListener(
            'click',
            function (e) {

                e.preventDefault();

                e.stopPropagation();

                move(1);

            }
        );


        /* =====================================================
           BACKGROUND CLICK
        ===================================================== */

        lightbox.addEventListener(
            'click',
            function (e) {

                if (
                    e.target === lightbox
                ) {

                    closeLightbox();

                }

            }
        );


        /* =====================================================
           KEYBOARD
        ===================================================== */

        document.addEventListener(
            'keydown',
            function (e) {

                if (
                    !lightbox.classList.contains(
                        'is-open'
                    )
                ) {
                    return;
                }


                /* ESC */

                if (
                    e.key === 'Escape'
                ) {

                    e.preventDefault();

                    closeLightbox();

                    return;

                }


                /* LEFT */

                if (
                    e.key === 'ArrowLeft'
                ) {

                    e.preventDefault();

                    move(-1);

                    return;

                }


                /* RIGHT */

                if (
                    e.key === 'ArrowRight'
                ) {

                    e.preventDefault();

                    move(1);

                    return;

                }

            }
        );


        /* =====================================================
           MOBILE SWIPE
        ===================================================== */

        lightbox.addEventListener(
            'touchstart',
            function (e) {

                if (
                    !e.changedTouches.length
                ) {
                    return;
                }


                const touch =
                    e.changedTouches[0];


                touchStartX =
                    touch.clientX;

                touchStartY =
                    touch.clientY;

            },
            {
                passive: true
            }
        );


        lightbox.addEventListener(
            'touchend',
            function (e) {

                if (
                    !e.changedTouches.length
                ) {
                    return;
                }


                const touch =
                    e.changedTouches[0];


                const dx =
                    touch.clientX -
                    touchStartX;


                const dy =
                    touch.clientY -
                    touchStartY;


                /*
                   Sadece yatay swipe.
                */

                if (
                    Math.abs(dx) > 55 &&
                    Math.abs(dx) > Math.abs(dy)
                ) {

                    if (dx < 0) {

                        move(1);

                    }

                    else {

                        move(-1);

                    }

                }

            },
            {
                passive: true
            }
        );


        /* =====================================================
           RESIZE
        ===================================================== */

        window.addEventListener(
            'resize',
            function () {

                /*
                   Lightbox açıkken sayfanın konumunu
                   değiştirme.
                */

                if (lightboxIsOpen) {

                    window.scrollTo(
                        0,
                        savedScrollY
                    );

                }

            },
            {
                passive: true
            }
        );


        /* =====================================================
           PAGE HIDE
        ===================================================== */

        window.addEventListener(
            'pagehide',
            function () {

                const body =
                    document.body;

                const html =
                    document.documentElement;


                body.style.overflow =
                    previousBodyOverflow;

                body.style.touchAction =
                    previousBodyTouchAction;

                html.style.overflow =
                    previousHtmlOverflow;

                html.style.touchAction =
                    previousHtmlTouchAction;


                lightboxIsOpen = false;

            }
        );


        /* =====================================================
           READY
        ===================================================== */

        console.log(
            'ARCHITUNA Lightbox hazır:',
            cards.length,
            'proje'
        );

    }


    /* =========================================================
       DOM READY
    ========================================================= */

    if (
        document.readyState === 'loading'
    ) {

        document.addEventListener(
            'DOMContentLoaded',
            initProjectLightbox
        );

    }

    else {

        initProjectLightbox();

    }

})();

</script>
