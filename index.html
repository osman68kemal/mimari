<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARCHITUNA.COM.TR | TUNALI MİMARLIK</title>

<meta name="description"
content="ARCHITUNA.COM.TR — Tunalı Mimarlık. Architecture, design, visualization and spatial ideas by Architect Osman Kemal Tunalı.">

<meta name="theme-color" content="#080808">

<style>

/* =========================================================
   ARCHITUNA — GLOBAL ARCHITECTURE STUDIO
========================================================= */

@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Inter:wght@300;400;500;600&family=Manrope:wght@300;400;500;600;700&display=swap');


/* =========================================================
   ROOT
========================================================= */

:root {
    --black: #080808;
    --black-soft: #101010;
    --black-card: #141414;
    --white: #efefea;
    --white-soft: #d5d5cf;
    --gray: #858581;
    --gray-dark: #555550;
    --line: rgba(255,255,255,.12);
    --line-soft: rgba(255,255,255,.065);
    --cream: #e9e8e2;
    --ease: cubic-bezier(.16,1,.3,1);
}


/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    scroll-padding-top: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: var(--black);
    color: var(--white);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    overflow-anchor: none;
    cursor: none;
}

body::selection {
    background: white;
    color: black;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font: inherit;
}


/* =========================================================
   NOISE
========================================================= */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 99990;
    pointer-events: none;
    opacity: .035;
    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.65'/%3E%3C/svg%3E");
    mix-blend-mode: soft-light;
}


/* =========================================================
   CUSTOM CURSOR
========================================================= */

.cursor {
    position: fixed;
    width: 7px;
    height: 7px;
    background: white;
    border-radius: 50%;
    pointer-events: none;
    z-index: 99999;
    transform: translate(-50%,-50%);
    mix-blend-mode: difference;
}

.cursor-ring {
    position: fixed;
    width: 42px;
    height: 42px;
    border: 1px solid rgba(255,255,255,.55);
    border-radius: 50%;
    pointer-events: none;
    z-index: 99998;
    transform: translate(-50%,-50%);
    transition:
        width .45s var(--ease),
        height .45s var(--ease),
        border-color .3s ease;
}

.cursor-label {
    position: fixed;
    pointer-events: none;
    z-index: 99997;
    font-family: 'DM Mono', monospace;
    font-size: 7px;
    letter-spacing: 2px;
    color: white;
    opacity: 0;
    transform: translate(16px,16px);
    transition: opacity .3s ease;
}


/* =========================================================
   GLOBAL LOGO
========================================================= */

.site-logo-bg {
    position: fixed;
    left: 50%;
    top: 50%;
    width: min(72vw,1100px);
    transform:
        translate(-50%,-50%)
        scale(1);
    z-index: 0;
    pointer-events: none;
    opacity: .025;
    filter:
        grayscale(1)
        contrast(1.2);
    mix-blend-mode: difference;
    transition: opacity 1s ease;
}

.site-logo-bg img {
    display: block;
    width: 100%;
    height: auto;
    transition:
        transform .25s var(--ease);
}


/* =========================================================
   INTRO
========================================================= */

#intro {
    position: fixed;
    inset: 0;
    background: #030303;
    z-index: 90000;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
        opacity 1.5s var(--ease);
}

#intro-video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: .62;
    filter:
        contrast(1.08)
        brightness(.78);
}

.intro-overlay {
    position: absolute;
    inset: 0;
    background:
        radial-gradient(
            circle at center,
            transparent 0%,
            rgba(0,0,0,.15) 30%,
            rgba(0,0,0,.88) 100%
        );
}

.intro-lines {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: .14;
    background:
        linear-gradient(
            90deg,
            transparent 49.9%,
            rgba(255,255,255,.6) 50%,
            transparent 50.1%
        ),
        linear-gradient(
            transparent 49.9%,
            rgba(255,255,255,.6) 50%,
            transparent 50.1%
        );
}

.intro-corner {
    position: absolute;
    left: 35px;
    right: 35px;
    top: 35px;
    bottom: 35px;
    border: 1px solid rgba(255,255,255,.08);
}

.intro-content {
    position: relative;
    z-index: 5;
    text-align: center;
}

.intro-small {
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 6px;
    color: #aaa;
    margin-bottom: 28px;
}

.intro-title {
    font-family: 'Manrope', sans-serif;
    font-size: clamp(48px,10vw,155px);
    font-weight: 300;
    letter-spacing: .08em;
    animation:
        introZoom 5s var(--ease) forwards;
}

.intro-sub {
    margin-top: 25px;
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 5px;
    color: #777;
}

@keyframes introZoom {
    0% { opacity: 0; transform: scale(.65); letter-spacing: .25em; }
    20% { opacity: 1; }
    100% { opacity: 0; transform: scale(1.7); letter-spacing: .08em; }
}


/* =========================================================
   MAIN
========================================================= */

main {
    position: relative;
    z-index: 1;
    opacity: 0;
    transition: opacity 1.4s ease;
}

body.site-loaded main {
    opacity: 1;
}


/* =========================================================
   NAVBAR
========================================================= */

.navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 30px 5vw;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    z-index: 5000;
    mix-blend-mode: difference;
    transition: padding .6s var(--ease);
}

.navbar.scrolled {
    padding-top: 18px;
    padding-bottom: 18px;
}

.logo-text {
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    letter-spacing: 5px;
    font-weight: 500;
}

.logo-sub {
    margin-top: 6px;
    font-family: 'DM Mono', monospace;
    font-size: 7px;
    letter-spacing: 3px;
    opacity: .55;
}

.nav-links {
    list-style: none;
    display: flex;
    gap: 34px;
}

.nav-links a {
    position: relative;
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
}

.nav-links a::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -7px;
    width: 0;
    height: 1px;
    background: white;
    transition: width .5s var(--ease);
}

.nav-links a:hover::after {
    width: 100%;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    position: relative;
    min-height: 100vh;
    padding: 140px 8vw 90px;
    display: flex;
    align-items: center;
    overflow: hidden;
}

.hero-grid {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: .16;
    background-image:
        linear-gradient(to right, transparent calc(20% - .5px), rgba(255,255,255,.13) 20%, transparent calc(20% + .5px)),
        linear-gradient(to right, transparent calc(40% - .5px), rgba(255,255,255,.13) 40%, transparent calc(40% + .5px)),
        linear-gradient(to right, transparent calc(60% - .5px), rgba(255,255,255,.13) 60%, transparent calc(60% + .5px)),
        linear-gradient(to right, transparent calc(80% - .5px), rgba(255,255,255,.13) 80%, transparent calc(80% + .5px));
}

.hero-grid::after {
    content: "";
    position: absolute;
    left: 8vw;
    right: 8vw;
    top: 50%;
    height: 1px;
    background: rgba(255,255,255,.08);
}

.hero-content {
    position: relative;
    z-index: 10;
    max-width: 1100px;
}

.eyebrow {
    display: flex;
    align-items: center;
    gap: 15px;
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 4px;
    color: #777;
    margin-bottom: 38px;
}

.eyebrow::before {
    content: "";
    width: 35px;
    height: 1px;
    background: #777;
}

.hero-title {
    font-family: 'Manrope', sans-serif;
    font-size: clamp(62px,10.5vw,160px);
    font-weight: 300;
    line-height: .82;
    letter-spacing: -.075em;
}

.hero-title span {
    display: block;
}

.hero-title .outline {
    color: transparent;
    -webkit-text-stroke: 1px rgba(255,255,255,.8);
    transition: color .6s ease;
}

.hero-title:hover .outline {
    color: rgba(255,255,255,.04);
}

.hero-description {
    max-width: 530px;
    margin-top: 62px;
    font-size: 14px;
    line-height: 1.9;
    color: #858581;
    font-weight: 300;
}

.hero-bottom {
    position: absolute;
    left: 8vw;
    right: 8vw;
    bottom: 35px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: 'DM Mono', monospace;
    font-size: 7px;
    letter-spacing: 3px;
    color: #666;
}

.hero-bottom span:last-child {
    display: flex;
    align-items: center;
    gap: 12px;
}

.hero-bottom span:last-child::before {
    content: "";
    width: 35px;
    height: 1px;
    background: #555;
}


/* =========================================================
   SECTION SYSTEM
========================================================= */

section {
    position: relative;
    z-index: 1;
    padding: 170px 8vw;
}

.section-number {
    font-family: 'DM Mono', monospace;
    font-size: 7px;
    letter-spacing: 4px;
    color: #666;
    margin-bottom: 42px;
    display: flex;
    align-items: center;
    gap: 15px;
}

.section-number::before {
    content: "";
    width: 25px;
    height: 1px;
    background: #555;
}

.section-title {
    font-family: 'Manrope', sans-serif;
    font-size: clamp(46px,7vw,105px);
    font-weight: 300;
    line-height: .9;
    letter-spacing: -.055em;
}

.section-title em {
    font-style: normal;
    color: #575752;
}


/* =========================================================
   MANIFESTO
========================================================= */

.manifesto {
    min-height: 90vh;
    display: flex;
    align-items: center;
    background: linear-gradient(135deg, #101010 0%, #0c0c0c 100%);
    overflow: hidden;
}

.manifesto::before {
    content: "02";
    position: absolute;
    right: -3vw;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Manrope';
    font-size: 35vw;
    line-height: 1;
    color: rgba(255,255,255,.018);
    font-weight: 700;
}

.manifesto-grid {
    width: 100%;
    display: grid;
    grid-template-columns: 1.05fr .95fr;
    gap: 12vw;
    align-items: end;
}

.manifesto-text {
    font-size: clamp(19px,2vw,29px);
    line-height: 1.6;
    color: #999;
    font-weight: 300;
}

.manifesto-text strong {
    color: white;
    font-weight: 400;
}

.manifesto-mark {
    margin-top: 70px;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 15px;
    font-family: 'DM Mono', monospace;
    font-size: 7px;
    letter-spacing: 3px;
    color: #555;
}

.manifesto-mark::before {
    content: "";
    width: 70px;
    height: 1px;
    background: #555;
}


/* =========================================================
   PROJECTS
========================================================= */

.projects {
    background: #080808;
    overflow: hidden;
}

.projects-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 60px;
}

.projects-intro {
    max-width: 250px;
    font-family: 'DM Mono', monospace;
    font-size: 7px;
    line-height: 2;
    letter-spacing: 2px;
    color: #555;
    padding-bottom: 8px;
}

.project-archive {
    margin-top: 115px;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 70px 24px;
    align-items: start;
}


/* =========================================================
   PROJECT GROUP LABELS
========================================================= */

.project-group-label {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-bottom: 16px;
    margin-top: 18px;
    border-bottom: 1px solid rgba(255,255,255,.12);
}
.project-group-label span {
    font-family: 'Manrope', sans-serif;
    font-size: clamp(18px,2vw,28px);
    font-weight: 300;
    letter-spacing: -.04em;
}
.project-group-label small {
    font-family: 'DM Mono', monospace;
    font-size: 7px;
    letter-spacing: 2px;
    color: #666;
}

/* =========================================================
   PROJECT CARD & GRID FIXES
========================================================= */

.project-card {
    position: relative;
    grid-column: span 1;
    overflow: hidden;
    padding-top: 20px;
    cursor: none;
    transition: transform .8s var(--ease);
}

.project-card.project-wide {
    grid-column: span 2;
}

.project-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 35px;
    height: 1px;
    background: white;
    z-index: 20;
    transition: width .8s var(--ease);
}

.project-card:hover::before {
    width: 100%;
}

.project-card:hover {
    transform: translateY(-10px);
}


/* =========================================================
   PROJECT IMAGE (UNIFIED HEIGHT FOR ALIGNMENT)
========================================================= */

.project-card .project-image {
    position: relative;
    width: 100%;
    /* Yükseklik eşitlendi, böylece masaüstünde satırlar birbirine girmez */
    height: 480px; 
    overflow: hidden;
    background: #121212;
    cursor: pointer;
}

.project-card .project-image::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 38%, rgba(0,0,0,.88) 100%);
    z-index: 2;
    pointer-events: none;
}

.project-card .project-image img,
.project-video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    filter: grayscale(35%) contrast(1.05);
    transform: scale(1.035);
    transition: transform 1.6s var(--ease), filter 1s ease;
}

.project-card:hover .project-image img,
.project-card:hover .project-video {
    transform: scale(1.10);
    filter: grayscale(0%) contrast(1.08);
}


/* =========================================================
   VIEW INDICATOR
========================================================= */

.project-view {
    position: absolute;
    right: 25px;
    top: 45px;
    z-index: 10;
    width: 45px;
    height: 45px;
    border: 1px solid rgba(255,255,255,.35);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Mono', monospace;
    font-size: 7px;
    letter-spacing: 1px;
    color: white;
    opacity: 0;
    transform: scale(.7);
    transition: opacity .5s ease, transform .5s var(--ease);
}

.project-card:hover .project-view {
    opacity: 1;
    transform: scale(1);
}


/* =========================================================
   PROJECT NUMBER
========================================================= */

.project-number {
    font-family: 'DM Mono', monospace;
    font-size: 7px;
    letter-spacing: 4px;
    color: #bbb;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.project-number::before {
    content: "";
    width: 16px;
    height: 1px;
    background: #999;
}


/* =========================================================
   PROJECT INFO
========================================================= */

.project-card .project-info {
    position: absolute;
    left: 30px;
    right: 30px;
    bottom: 30px;
    z-index: 5;
}

.project-card .project-name {
    font-family: 'Manrope', sans-serif;
    font-size: clamp(29px,4vw,62px);
    line-height: .9;
    font-weight: 300;
    letter-spacing: -.055em;
}

.project-card .project-location {
    margin-top: 13px;
    font-family: 'DM Mono', monospace;
    font-size: 7px;
    letter-spacing: 3px;
    color: #aaa;
}


/* =========================================================
   LIGHTBOX
========================================================= */

.lightbox {
    position: fixed;
    inset: 0;
    z-index: 100000;
    background: rgba(0,0,0,.96);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5vw;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity .6s ease, visibility .6s ease;
}

.lightbox.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
}

.lightbox::before {
    content: "";
    position: absolute;
    inset: 30px;
    border: 1px solid rgba(255,255,255,.08);
    pointer-events: none;
}

.lightbox-image,
.lightbox-video {
    position: relative;
    z-index: 2;
    max-width: 92vw;
    max-height: 88vh;
    width: auto;
    height: auto;
    object-fit: contain;
    display: block;
    box-shadow: 0 40px 100px rgba(0,0,0,.7);
    transform: scale(.94);
    opacity: 0;
    transition: transform .7s var(--ease), opacity .5s ease;
}

.lightbox.active .lightbox-image,
.lightbox.active .lightbox-video {
    transform: scale(1);
    opacity: 1;
}

.lightbox-close {
    position: absolute;
    top: 35px;
    right: 40px;
    z-index: 10;
    width: 50px;
    height: 50px;
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 50%;
    background: transparent;
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: background .3s ease, transform .4s var(--ease);
}

.lightbox-close:hover {
    background: white;
    color: black;
    transform: rotate(90deg);
}

.lightbox-arrow {
    position: absolute;
    top: 50%;
    z-index: 10;
    transform: translateY(-50%);
    width: 58px;
    height: 58px;
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 50%;
    background: rgba(0,0,0,.35);
    color: white;
    cursor: pointer;
    font-size: 18px;
    transition: background .3s ease, transform .4s var(--ease);
}

.lightbox-arrow:hover {
    background: white;
    color: black;
}

.lightbox-prev { left: 35px; }
.lightbox-next { right: 35px; }

.lightbox-meta {
    position: absolute;
    left: 40px;
    bottom: 35px;
    z-index: 10;
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 3px;
    color: #888;
}

.lightbox-counter {
    position: absolute;
    right: 40px;
    bottom: 35px;
    z-index: 10;
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 3px;
    color: #777;
}


/* =========================================================
   SERVICES
========================================================= */

.services {
    background: var(--cream);
    color: #111;
    overflow: hidden;
}

.services::before {
    content: "SERVICES";
    position: absolute;
    right: -3vw;
    top: 50%;
    transform: translateY(-50%) rotate(90deg);
    font-family: 'Manrope';
    font-size: 13vw;
    font-weight: 700;
    color: rgba(0,0,0,.025);
    letter-spacing: -.07em;
}

.services .section-number { color: #777; }
.services .section-number::before { background: #777; }

.services-list {
    margin-top: 105px;
    border-top: 1px solid #aaa;
}

.service {
    position: relative;
    min-height: 105px;
    padding: 28px 0;
    border-bottom: 1px solid #aaa;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: padding .5s var(--ease);
}

.service::before {
    content: "";
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 0;
    height: 1px;
    background: #111;
    transition: width .7s var(--ease);
}

.service:hover::before { width: 100%; }
.service:hover { padding-left: 30px; padding-right: 30px; }

.service-name {
    font-family: 'Manrope';
    font-size: clamp(27px,4vw,58px);
    font-weight: 300;
    letter-spacing: -.05em;
}

.service-number {
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 3px;
    color: #777;
}


/* =========================================================
   BRAND
========================================================= */

.brand-section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
    background: #090909;
}

.brand-section::before {
    content: "ARCHITUNA";
    position: absolute;
    font-family: 'Manrope';
    font-size: 19vw;
    font-weight: 700;
    color: rgba(255,255,255,.018);
    white-space: nowrap;
    letter-spacing: -.09em;
}

.brand-section::after {
    content: "";
    position: absolute;
    width: 45vw;
    height: 45vw;
    border: 1px solid rgba(255,255,255,.05);
    border-radius: 50%;
}

.brand-main {
    position: relative;
    z-index: 2;
}

.brand-main h2 {
    font-family: 'Manrope';
    font-size: clamp(55px,11vw,175px);
    font-weight: 300;
    letter-spacing: -.085em;
    line-height: .8;
}

.brand-switch {
    margin-top: 35px;
    height: 25px;
    overflow: hidden;
}

.brand-switch span {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 5px;
    color: #777;
    animation: brandChange 5s infinite;
}

@keyframes brandChange {
    0%,42% { transform: translateY(0); }
    50%,92% { transform: translateY(-25px); }
    100% { transform: translateY(0); }
}


/* =========================================================
   CONTACT
========================================================= */

.contact {
    min-height: 90vh;
    background:
        radial-gradient(
            circle at 80% 30%,
            #191919 0%,
            #101010 32%,
            #101010 100%
        );
    overflow: hidden;
}

.contact::before {
    content: "";
    position: absolute;
    right: 8vw;
    top: 18%;
    width: 1px;
    height: 65%;
    background:
        linear-gradient(
            transparent,
            rgba(255,255,255,.15),
            transparent
        );
}

.contact-title {
    font-family: 'Manrope';
    font-size: clamp(52px,9vw,135px);
    font-weight: 300;
    line-height: .87;
    letter-spacing: -.075em;
    max-width: 1100px;
}

.contact-title span { color: #555550; }

.contact-bottom {
    margin-top: 120px;
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 30px;
}

.contact-item {
    padding-top: 20px;
    border-top: 1px solid rgba(255,255,255,.12);
    font-family: 'DM Mono', monospace;
    font-size: 8px;
    letter-spacing: 2px;
    color: #888;
}

.contact-item strong {
    display: block;
    color: white;
    font-family: 'Inter';
    font-size: 10px;
    letter-spacing: 3px;
    margin-bottom: 12px;
    font-weight: 400;
}

.contact-item a { transition: color .3s ease; }
.contact-item a:hover { color: white; }


/* =========================================================
   FOOTER
========================================================= */

<footer>
    <span>© 2026 ARCHITUNA.COM.TR</span>
    <span>MİMAR OSMAN KEMAL TUNALI</span>
    <span>SARSILMAZ TEMELLER.</span>
</footer>

</main>

<script>

/* =========================================================
   SAYFA HER ZAMAN EN ÜSTTEN BAŞLASIN
========================================================= */
if ('scrollRestoration' in history) {
    history.scrollRestoration = 'manual';
}
window.addEventListener('beforeunload', function() {
    window.scrollTo(0,0);
});
window.addEventListener('load', function() {
    setTimeout(function() {
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    }, 20);
});

/* =========================================================
   INTRO
========================================================= */
const intro = document.getElementById('intro');
const introVideo = document.getElementById('intro-video');
let introFinished = false;

function finishIntro() {
    if (introFinished) return;
    introFinished = true;
    intro.style.opacity = '0';
    setTimeout(function() {
        intro.style.display = 'none';
        document.body.classList.add('site-loaded');
        window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    }, 1500);
}

introVideo.addEventListener('ended', finishIntro);
setTimeout(function() {
    if (intro.style.display !== 'none') {
        finishIntro();
    }
}, 9000);

/* =========================================================
   PROJECT VIDEOS
========================================================= */
document.querySelectorAll('.project-video').forEach(function(video) {
    video.muted = true;
    video.playsInline = true;
    video.loop = true;
    const play = video.play();
    if (play !== undefined) {
        play.catch(function() {
            video.muted = true;
        });
    }
});

/* =========================================================
   CURSOR
========================================================= */
const cursor = document.querySelector('.cursor');
const ring = document.querySelector('.cursor-ring');
const cursorLabel = document.querySelector('.cursor-label');
let mouseX = 0, mouseY = 0, ringX = 0, ringY = 0;

document.addEventListener('mousemove', function(e) {
    mouseX = e.clientX;
    mouseY = e.clientY;
    cursor.style.left = mouseX + 'px';
    cursor.style.top = mouseY + 'px';
    cursorLabel.style.left = mouseX + 'px';
    cursorLabel.style.top = mouseY + 'px';
});

function animateCursor() {
    ringX += (mouseX - ringX) * .13;
    ringY += (mouseY - ringY) * .13;
    ring.style.left = ringX + 'px';
    ring.style.top = ringY + 'px';
    requestAnimationFrame(animateCursor);
}
animateCursor();

/* =========================================================
   HOVER CURSOR
========================================================= */
document.querySelectorAll('a, .project-card, .service').forEach(function(element) {
    element.addEventListener('mouseenter', function() {
        ring.style.width = '72px';
        ring.style.height = '72px';
        ring.style.borderColor = 'rgba(255,255,255,.8)';
        if (element.classList.contains('project-card')) {
            cursorLabel.style.opacity = '1';
        }
    });
    element.addEventListener('mouseleave', function() {
        ring.style.width = '42px';
        ring.style.height = '42px';
        ring.style.borderColor = 'rgba(255,255,255,.55)';
        cursorLabel.style.opacity = '0';
    });
});

/* =========================================================
   NAVBAR SCROLL
========================================================= */
const navbar = document.querySelector('.navbar');
window.addEventListener('scroll', function() {
    if (window.scrollY > 80) {
        navbar.classList.add('scrolled');
    } else {
        navbar.classList.remove('scrolled');
    }
}, { passive: true });

/* =========================================================
   GLOBAL LOGO PARALLAX
========================================================= */
const logoWrapper = document.getElementById('global-logo-wrapper');
const logoImg = document.getElementById('global-logo-img');
window.addEventListener('scroll', function() {
    const scrollY = window.scrollY;
    const movement = scrollY * .035;
    const scale = 1 + Math.min(scrollY / 18000, .12);
    logoWrapper.style.transform = `translate(-50%, calc(-50% + ${movement}px)) scale(${scale})`;
}, { passive: true });

document.addEventListener('mousemove', function(e) {
    const x = (e.clientX / window.innerWidth - .5) * 30;
    const y = (e.clientY / window.innerHeight - .5) * 30;
    logoImg.style.transform = `translate(${x}px, ${y}px)`;
});

/* =========================================================
   SCROLL REVEAL
========================================================= */
const observer = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
        if (entry.isIntersecting) {
            entry.target.classList.add('visible');
        }
    });
}, { threshold: .12 });

document.querySelectorAll('.reveal').forEach(function(element) {
    observer.observe(element);
});

/* =========================================================
   PROJECT VIDEO — VIEWPORT OPTIMIZATION
========================================================= */
const videoObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
        const video = entry.target;
        if (entry.isIntersecting) {
            video.play().catch(function(){});
        } else {
            video.pause();
        }
    });
}, { threshold: .15 });

document.querySelectorAll('.project-video').forEach(function(video) {
    videoObserver.observe(video);
});

/* =========================================================
   PROJECT LIGHTBOX
========================================================= */
const lightbox = document.getElementById('lightbox');
const lightboxImage = document.getElementById('lightbox-image');
const lightboxClose = document.getElementById('lightbox-close');
const lightboxPrev = document.getElementById('lightbox-prev');
const lightboxNext = document.getElementById('lightbox-next');
const lightboxMeta = document.getElementById('lightbox-meta');
const lightboxCounter = document.getElementById('lightbox-counter');
const lightboxVideo = document.getElementById('lightbox-video');
const projectItems = Array.from(document.querySelectorAll('.project-image[data-gallery]'));
let currentProject = 0;
let currentGallery = [];
let currentGalleryIndex = 0;

function getGallery(item) {
    return (item.dataset.gallery || item.dataset.image || '').split('|').map(v => v.trim()).filter(Boolean);
}

function isVideo(src) {
    return /\.(mp4|webm|ogg)(\?|#|$)/i.test(src);
}

function openLightbox(index) {
    currentProject = index;
    currentGallery = getGallery(projectItems[currentProject]);
    currentGalleryIndex = 0;
    updateLightbox();
    lightbox.classList.add('active');
    lightbox.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
}

function closeLightbox() {
    lightbox.classList.remove('active');
    lightbox.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
    lightboxVideo.pause();
}

function updateLightbox() {
    const item = projectItems[currentProject];
    if (!item) return;

    currentGallery = getGallery(item);
    const src = currentGallery[currentGalleryIndex];
    const title = item.dataset.title || 'ARCHITUNA PROJECT';
    const category = item.dataset.category || '';

    lightboxImage.style.opacity = '0';
    lightboxVideo.style.opacity = '0';
    lightboxVideo.pause();

    const projectNo = String(currentProject + 1).padStart(2,'0');
    const imageNo = String(currentGalleryIndex + 1).padStart(2,'0');
    const imageTotal = String(currentGallery.length).padStart(2,'0');

    lightboxMeta.textContent = category + ' — ' + title + (currentGallery.length > 1 ? ' — GÖRSEL ' + imageNo : '');
    lightboxCounter.textContent = projectNo + ' / ' + String(projectItems.length).padStart(2,'0') + (currentGallery.length > 1 ? '  ·  ' + imageNo + ' / ' + imageTotal : '');

    setTimeout(function(){
        if (isVideo(src)) {
            lightboxImage.style.display = 'none';
            lightboxVideo.style.display = 'block';
            lightboxVideo.src = src;
            lightboxVideo.currentTime = 0;
            lightboxVideo.onloadeddata = function(){
                lightboxVideo.style.opacity = '1';
                lightboxVideo.play().catch(()=>{});
            };
            lightboxVideo.load();
        } else {
            lightboxVideo.style.display = 'none';
            lightboxImage.style.display = 'block';
            lightboxImage.src = src;
            lightboxImage.alt = title;
            lightboxImage.onload = function(){ lightboxImage.style.opacity = '1'; };
        }
    },120);
}

function nextProject() {
    if (currentGalleryIndex < currentGallery.length - 1) {
        currentGalleryIndex++;
    } else {
        currentProject = (currentProject + 1) % projectItems.length;
        currentGallery = getGallery(projectItems[currentProject]);
        currentGalleryIndex = 0;
    }
    updateLightbox();
}

function previousProject() {
    if (currentGalleryIndex > 0) {
        currentGalleryIndex--;
    } else {
        currentProject = (currentProject - 1 + projectItems.length) % projectItems.length;
        currentGallery = getGallery(projectItems[currentProject]);
        currentGalleryIndex = currentGallery.length - 1;
    }
    updateLightbox();
}

projectItems.forEach(function(item,index){
    item.addEventListener('click', function(){ openLightbox(index); });
});

lightboxClose.addEventListener('click', closeLightbox);
lightboxNext.addEventListener('click', nextProject);
lightboxPrev.addEventListener('click', previousProject);

lightbox.addEventListener('click', function(e){
    if (e.target === lightbox) closeLightbox();
});

/* =========================================================
   KEYBOARD CONTROL
========================================================= */
document.addEventListener('keydown', function(e) {
    if (!lightbox.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowRight') nextProject();
    if (e.key === 'ArrowLeft') previousProject();
});

/* =========================================================
   TOUCH SWIPE
========================================================= */
let touchStartX = 0;
let touchEndX = 0;

lightbox.addEventListener('touchstart', function(e) {
    touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

lightbox.addEventListener('touchend', function(e) {
    touchEndX = e.changedTouches[0].screenX;
    const difference = touchStartX - touchEndX;
    if (Math.abs(difference) < 50) return;
    if (difference > 0) {
        nextProject();
    } else {
        previousProject();
    }
}, { passive: true });

/* =========================================================
   SMOOTH ANCHOR
========================================================= */
document.querySelectorAll('a[href^="#"]').forEach(function(link) {
    link.addEventListener('click', function(e) {
        const target = document.querySelector(link.getAttribute('href'));
        if (!target) return;
        e.preventDefault();
        target.scrollIntoView({
            behavior: 'smooth',
            block: 'start'
        });
    });
});

</script>
</body>
</html>
